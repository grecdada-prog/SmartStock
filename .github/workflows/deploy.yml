name: CI/CD Pipeline SmartStock

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Job 1: Tests et Qualité du Code
  test:
    name: Tests & Code Quality
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: smartstock_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, json, zip
          coverage: xdebug
          tools: composer:v2

      - name: 📦 Copy .env
        run: |
          cp .env.example .env
          php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: 📦 Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: 🔑 Generate Key
        run: php artisan key:generate

      - name: 📁 Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: 🗄️ Run Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: smartstock_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: 🧪 Execute Tests (Feature and Unit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: smartstock_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test --coverage

      - name: 🔍 PHP Stan Analysis
        run: |
          composer require --dev phpstan/phpstan --no-interaction || true
          vendor/bin/phpstan analyse app --level=5 --no-progress || true

      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Job 2: Build Frontend Assets
  build-assets:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install NPM dependencies
        run: npm ci

      - name: 🏗️ Build assets
        run: npm run build

      - name: 📤 Upload compiled assets
        uses: actions/upload-artifact@v3
        with:
          name: compiled-assets
          path: public/build
          retention-days: 1

  # Job 3: Déploiement sur Render (seulement sur main)
  deploy:
    name: Deploy to Render
    needs: [test, build-assets]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json"

      - name: ✅ Deployment Success
        run: echo "🎉 Déploiement réussi sur Render!"

  # Job 4: Notification (optionnel)
  notify:
    name: Send Notifications
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📧 Send deployment notification
        run: |
          echo "Déploiement terminé. Statut: ${{ needs.deploy.result }}"
          # Vous pouvez ajouter des notifications Slack, Discord, Email ici
