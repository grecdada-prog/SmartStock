# Configuration Render pour SmartStock
services:
  # Application Web Laravel
  - type: web
    name: smartstock
    env: php
    region: frankfurt # Choisir la région la plus proche
    plan: starter # Gratuit pour commencer, passer à "standard" en production
    buildCommand: "./render-build.sh"
    startCommand: "php artisan serve --host=0.0.0.0 --port=$PORT"
    envVars:
      - key: APP_NAME
        value: SmartStock
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false # À configurer manuellement
      - key: APP_KEY
        generateValue: true # Render génère automatiquement

      # Base de données PostgreSQL
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: smartstock-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smartstock-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: smartstock-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: smartstock-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smartstock-db
          property: password

      # Cache & Session (utiliser base de données pour commencer)
      - key: CACHE_DRIVER
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Email (SendGrid - à configurer)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.sendgrid.net
      - key: MAIL_PORT
        value: 587
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false # À configurer manuellement
      - key: MAIL_FROM_NAME
        value: SmartStock
      - key: SENDGRID_API_KEY
        sync: false # À configurer manuellement

      # Autres configurations
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: FILESYSTEM_DISK
        value: local

    # Health check
    healthCheckPath: /up

    # Autoscaling (optionnel)
    autoDeploy: true

  # Base de données PostgreSQL
databases:
  - name: smartstock-db
    databaseName: smartstock
    plan: starter # Gratuit
    region: frankfurt
    # Sauvegardes automatiques activées
